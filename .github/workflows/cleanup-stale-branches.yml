name: Cleanup Stale Branches

on:
  schedule:
    - cron: '0 3 * * 1'  # Every Monday at 03:00 UTC
  workflow_dispatch:

jobs:
  cleanup:
    name: Auto-merge and delete stale branches
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Rebase and fast-forward stale branches into main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --prune origin

          PROTECTED_BRANCHES="main"

          for branch in $(git branch -r | grep 'origin/' | grep -v 'origin/HEAD' | sed 's|origin/||' | tr -d ' '); do
            skip=false
            for protected in $PROTECTED_BRANCHES; do
              if [ "$branch" = "$protected" ]; then
                skip=true
                break
              fi
            done
            [ "$skip" = "true" ] && continue

            # Branch already contained in main — just delete it
            if git merge-base --is-ancestor "origin/$branch" origin/main; then
              echo "Branch '$branch' is already merged — deleting."
              gh api -X DELETE "repos/{owner}/{repo}/git/refs/heads/$branch"
              continue
            fi

            # Attempt a dry-run rebase onto main to detect conflicts
            git checkout -q -b "dry-run/$branch" "origin/$branch"
            if git rebase "origin/main" > /dev/null 2>&1; then
              git checkout -q -B main origin/main
              # Fast-forward main to the successfully rebased tip
              git merge --ff-only "dry-run/$branch"
              git push origin main
              echo "Branch '$branch' rebased and fast-forwarded into main — deleting."
              gh api -X DELETE "repos/{owner}/{repo}/git/refs/heads/$branch"
            else
              git rebase --abort 2>/dev/null || true
              echo "Branch '$branch' has rebase conflicts — skipping."
            fi
            git checkout -q main
            git branch -D "dry-run/$branch" 2>/dev/null || true
          done
